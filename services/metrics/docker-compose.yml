version: '3'
services:
  metrics:
    image: samuelebistoletti/docker-statsd-influxdb-grafana:latest
    container_name: metrics
    hostname: metrics
    ports:
      - 3003:3003
      - 3004:8888
      - 8086:8086
      - 8125:8125/udp
    ulimits:
      nofile:
        soft: 66000
        hard: 66000
    labels:
      SERVICE_IGNORE: true
    networks:
      - local_default

networks: 
  local_default:
    external:
      name: local_default
